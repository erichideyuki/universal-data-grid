# Publicação no npm por tag: `git tag v0.3.3 && git push origin v0.3.3`.
# Roda o CI inteiro antes; confere que a tag bate com o package.json; ENVIA
# a versão para a área de espera do npm por Trusted Publishing (OIDC do
# GitHub: sem token no pipeline, com atestado de procedência) e cria o
# GitHub Release. A versão só vai ao ar quando o dono aprova com 2FA: no
# npmjs.com (pacote → Staged) ou `npm stage list` + `npm stage approve <id>`.
# Tag com sufixo (`v0.4.0-beta.1`) vai para a dist-tag `next`, não `latest`.
#
# Configuração única no npmjs.com: pacote → Settings → Trusted Publisher →
# GitHub Actions, organização/usuário `erichideyuki`, repositório
# `universal-data-grid`, workflow `publish.yml`, ambiente `npm`, permissão
# "npm stage publish".
name: Publish to npm

on:
  push:
    tags: ['v*.*.*']

# Nunca cancelar uma publicação em andamento.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ github.ref_name }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write # GitHub Release
      id-token: write # Trusted Publishing (OIDC) e procedência
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # `npm stage` (publicação com aprovação) existe a partir do npm 12.
      - run: npm install -g npm@12

      - run: npm ci

      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi

      # O CI acima já rodou lint, tipos e testes: aqui só o build do pacote
      # (o que o prepack faria) e a publicação sem repetir os scripts.
      - name: Build
        run: npm run build && npm run bundle:browser

      - name: Stage on npm (waits for the owner's 2FA approval)
        run: |
          tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then tag=next; fi
          npm stage publish . --ignore-scripts --tag "$tag" --access public --provenance
          echo "::notice::$GITHUB_REF_NAME staged on npm. Approve it on npmjs.com or with npm stage approve <id> to publish."

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease
