[package]
name = "grid-pdf"
version = "0.1.0"
description = "PDF export engine of <u-grid> (@universal-material/data-grid/export-pdf): tagged PDF (PDF/UA-1) tables with bidi and shaping, compiled to WebAssembly"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# leitura de fontes, TTC e subset TrueType (Universal Office, branch rust-core; trocar por um commit da main quando a migração para o Rust acabar)
uo-fonts = { git = "https://github.com/erichideyuki/universal-office", rev = "62b381d74238fd0777d63f3c567ecdc091e0e844" }
# shaping (porta do HarfBuzz) e métricas de fonte (ttf-parser)
rustybuzz = "0.20.1"
# bidi (UAX #9), quebra de linha (UAX #14) e grafemas (UAX #29)
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13"
# deflate dos streams (porta do zlib-ng: ~30% mais rápida que o miniz_oxide no mesmo nível)
zlib-rs = { version = "0.5.5", default-features = false, features = ["rust-allocator"] }
# decodificação de PNG
png = { version = "0.17", default-features = false }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
